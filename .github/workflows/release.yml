name: Release

# Publishes a GitHub release with the standalone Windows zip (built and tested
# by build.yml) and release notes from CHANGELOG.md. Three ways to start it:
#
#  * Actions tab > Release > Run workflow (on main): creates the tag vX.Y.Z for
#    the version in pclink/__init__.py and publishes the release.
#  * Push a tag vX.Y.Z.
#  * Create the release by hand on GitHub with a new tag vX.Y.Z: the tag push
#    starts this workflow, which attaches the zip (and fills in empty notes).
#
# The tag must match the version in pclink/__init__.py, manifest.json and
# pyproject.toml, and CHANGELOG.md must have a section for it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.3.0 (leave empty for the version in pclink/__init__.py)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release: true   # also runs the signing job (environment "release-signing")
    secrets: inherit

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Work out the tag and check every version number
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BUILT: ${{ needs.build.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            wanted="${INPUT_VERSION:-$BUILT}"
            tag="v${wanted#v}"
          fi
          version="${tag#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/pclink/manifest.json'))['version'])")
          pyproject=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag=$tag package=$BUILT manifest=$manifest pyproject=$pyproject"
          if [ "$version" != "$BUILT" ] || [ "$version" != "$manifest" ] || [ "$version" != "$pyproject" ]; then
            echo "::error::$tag does not match the version in pclink/__init__.py ($BUILT), manifest.json ($manifest) and pyproject.toml ($pyproject)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: python3 scripts/release_notes.py "$TAG" > notes.md

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          # the zip from the signing job (signed when a certificate is configured)
          name: ${{ needs.build.outputs.release_artifact }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          ZIP: ${{ needs.build.outputs.artifact }}.zip
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists already: attaching the zip."
            gh release upload "$TAG" "$ZIP" --clobber
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gh release create "$TAG" "$ZIP" --title "PC Link $TAG" --notes-file notes.md --verify-tag
          else
            # Run from the Actions tab: create the tag on the commit this run was started on.
            gh release create "$TAG" "$ZIP" --title "PC Link $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "  " + .name)'
