name: Windows build

# Builds the standalone Windows version (no Python needed on the PC), then tests
# the zip exactly as a user gets it: extract, check every bundled component,
# install and start the real service, verify it, uninstall it.
# Tagged releases reuse this workflow (workflow_call with release: true) and
# attach the zip.
#
# Two jobs, on purpose:
#   build    - runs for every push and pull request.  It installs and runs
#              third-party code (pip, PyInstaller and its hooks) and never sees
#              the code-signing certificate.
#   package  - runs on the release path only, in the "release-signing"
#              environment.  It runs no code from the repository or from PyPI
#              before the certificate is used: it takes the zip the build job
#              made, signs it and makes the signed catalog.
# Keep SIGN_PFX_BASE64 / SIGN_PFX_PASSWORD as secrets of that environment and give
# it required reviewers (Settings > Environments), so that nothing is signed
# without somebody approving the run.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Build for a release (sign the package when a certificate is configured)
        type: boolean
        default: false
    outputs:
      version:
        description: Version that was built
        value: ${{ jobs.build.outputs.version }}
      artifact:
        description: Name of the zip (without .zip)
        value: ${{ jobs.build.outputs.artifact }}
      release_artifact:
        description: Name of the uploaded artifact that holds the zip to publish (release builds only)
        value: ${{ jobs.package.outputs.artifact }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test the standalone Windows version
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-windows.txt
            packaging/requirements-build.txt
            packaging/requirements-lock.txt

      - name: Read the version
        id: version
        run: |
          $version = python -c "import pclink; print(pclink.__version__)"
          if ($LASTEXITCODE) { exit 1 }
          # the version ends up in file names and scripts: nothing but the usual characters
          if ($version -notmatch '^[0-9A-Za-z.+-]{1,40}$') { throw "unexpected version string" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=PCLink-$version-windows-x64" >> $env:GITHUB_OUTPUT

      - name: Install the build tools
        run: |
          # pip stays the one that came with the (pinned) setup-python: an unpinned upgrade would run
          # whatever PyPI hands out at that moment in the job whose output is signed
          if (Test-Path packaging/requirements-lock.txt) {
            # exact versions with their hashes (made by packaging/make_lock.py): what is built is what was reviewed
            python -m pip install --require-hashes -r packaging/requirements-lock.txt
          } else {
            Write-Host "::warning::packaging/requirements-lock.txt is missing; installing the newest matching versions (run packaging/make_lock.py and commit the result)"
            python -m pip install -r packaging/requirements-build.txt
          }
          if ($LASTEXITCODE) { exit 1 }

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python packaging/make_icon.py
          if ($LASTEXITCODE) { exit 1 }
          pyinstaller --noconfirm --clean packaging/pclink.spec
          if ($LASTEXITCODE) { exit 1 }
          Copy-Item packaging/install.ps1, packaging/install.cmd, packaging/uninstall.ps1, packaging/uninstall.cmd,
                    packaging/README-FIRST.txt, packaging/defender-exclusion.ps1, config.example.yaml, LICENSE `
                    -Destination dist/pclink/
          # The package says which version it is.  The self-update compares this with the release it
          # asked for and with the installed version, and the signed catalog covers it, so an old
          # package cannot be handed out under a new name (pclink/updater.py).
          [IO.File]::WriteAllText((Join-Path (Resolve-Path dist/pclink) "VERSION"), "$env:VERSION`n", [Text.Encoding]::ASCII)

      - name: Package
        env:
          ARTIFACT: ${{ steps.version.outputs.artifact }}
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item dist/pclink package/PCLink -Recurse
          Compress-Archive -Path package/PCLink -DestinationPath "$env:ARTIFACT.zip"
          Get-Item "$env:ARTIFACT.zip" | Format-Table Name, Length

      - name: Test the executables from the extracted zip
        env:
          ARTIFACT: ${{ steps.version.outputs.artifact }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Expand-Archive "$env:ARTIFACT.zip" -DestinationPath "$env:RUNNER_TEMP\extract"
          $dir = "$env:RUNNER_TEMP\extract\PCLink"
          $exe = "$dir\pclink.exe"

          $v = & $exe version
          if ($LASTEXITCODE -or $v -ne $env:VERSION) { throw "version check failed: '$v'" }
          $inFile = (Get-Content "$dir\VERSION" -TotalCount 1).Trim()
          if ($inFile -ne $env:VERSION) { throw "the VERSION file says '$inFile'" }

          # Every backend the build is meant to bundle must be importable in the frozen program.
          & $exe selftest --require pywin32,servicemanager,comtypes,uia,zeroconf,nvml,pythonnet,pillow,now-playing,agent-exe
          if ($LASTEXITCODE) { throw "selftest failed" }

          $cfg = Join-Path $env:RUNNER_TEMP "check.yaml"
          & $exe init-config --path $cfg
          if ($LASTEXITCODE) { throw "init-config failed" }
          & $exe check-config --config $cfg
          if ($LASTEXITCODE) { throw "check-config failed" }
          $info = (& $exe api-info --config $cfg) | ConvertFrom-Json
          if ($LASTEXITCODE -or $info.port -ne 47392) { throw "api-info failed" }

          # The windowed agent starts, loads everything and refuses to run without the service (exit code 2).
          $agent = Start-Process -FilePath "$dir\pclink-agent.exe" -PassThru -Wait
          if ($agent.ExitCode -ne 2) { throw "pclink-agent.exe exited with $($agent.ExitCode), expected 2" }

      - name: Install, run and uninstall the service (with a real login block)
        run: |
          $dir = "$env:RUNNER_TEMP\extract\PCLink"

          # A throw-away local account with a zero-minute limit: the service must block its logins.
          $user = "pclinktest"
          # 14 characters at most: for longer passwords net.exe asks a Y/N question nobody can answer here.
          $password = "Pc!" + [guid]::NewGuid().ToString("N").Substring(0, 8) + "Aa1"
          net.exe user $user $password /add | Out-Null
          if ($LASTEXITCODE) { throw "could not create the test account" }
          function Get-LogonHours {
            $line = net.exe user $user | Where-Object { $_ -match '^Logon hours allowed' }
            return ($line -replace '^Logon hours allowed\s+', '').Trim()
          }
          if ((Get-LogonHours) -ne "All") { throw "the new test account should start with logon hours 'All'" }

          New-Item -ItemType Directory -Force -Path "$env:ProgramData\PCLink" | Out-Null
          @"
          time_limits:
            block_method: logon_hours
            users:
              - name: $user
                daily_limit_minutes: 0
          "@ | Set-Content -Encoding utf8 "$env:ProgramData\PCLink\config.yaml"

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$dir\install.ps1" -NoPause
          if ($LASTEXITCODE) { throw "install.ps1 failed with exit code $LASTEXITCODE" }

          $svc = Get-CimInstance Win32_Service -Filter "Name='PCLink'"
          if (-not $svc) { throw "the service was not installed" }
          Write-Host "Service binary: $($svc.PathName)"
          if ($svc.PathName -notlike '"*\Program Files\PCLink\pclink.exe" service') { throw "unexpected service binary path" }
          if ($svc.StartMode -ne "Auto") { throw "start mode is $($svc.StartMode), expected Auto" }

          for ($i = 0; $i -lt 30 -and (Get-LogonHours) -ne "None"; $i++) { Start-Sleep -Seconds 1 }
          $hours = Get-LogonHours
          Write-Host "Logon hours of $user while out of time: $hours"
          if ($hours -ne "None") { throw "the service did not block the out-of-time account (logon hours: $hours)" }

          Start-Sleep -Seconds 15
          $state = (Get-Service PCLink).Status
          if ($state -ne "Running") { throw "the service is '$state' after running for a while" }

          $sd = (sc.exe sdshow PCLink) -join ""
          Write-Host "Service security descriptor: $sd"
          if ($sd -notmatch [regex]::Escape("(A;;CCLCSWLOCRRC;;;IU)")) { throw "the hardened service ACL was not applied" }

          # the data folder (configuration with its secrets) is for administrators and SYSTEM only
          $acl = (icacls.exe "$env:ProgramData\PCLink") -join "`n"
          Write-Host $acl
          if ($acl -match 'BUILTIN\\Users|Authenticated Users|Everyone') { throw "the data folder is open to ordinary users" }

          # the installer reported what it did, where the service reads it
          $result = Get-Content "$env:ProgramData\PCLink\install-result.json" -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw "install-result.json does not report success" }

          $log = Join-Path $env:ProgramData "PCLink\logs\pclink.log"
          if (-not (Select-String -Path $log -Pattern " starting " -Quiet)) { throw "the service log has no start message" }
          Get-Content $log -Tail 15

          # Upgrade in place (the same version again): the folders are swapped and the service comes back.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$dir\install.ps1" -NoPause
          if ($LASTEXITCODE) { throw "the second run of install.ps1 (upgrade) failed with exit code $LASTEXITCODE" }
          if ((Get-Service PCLink).Status -ne "Running") { throw "the service is not running after the upgrade" }
          if (Test-Path "$env:ProgramFiles\PCLink.old") { throw "the upgrade left PCLink.old behind" }
          if (Test-Path "$env:ProgramFiles\PCLink.new") { throw "the upgrade left PCLink.new behind" }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:ProgramFiles\PCLink\uninstall.ps1" -NoPause
          if ($LASTEXITCODE) { throw "uninstall.ps1 failed with exit code $LASTEXITCODE" }
          for ($i = 0; $i -lt 30 -and (Get-CimInstance Win32_Service -Filter "Name='PCLink'"); $i++) { Start-Sleep -Seconds 1 }
          if (Get-CimInstance Win32_Service -Filter "Name='PCLink'") { throw "the service is still registered after uninstalling" }
          if (Test-Path "$env:ProgramFiles\PCLink") { throw "the program folder is still present after uninstalling" }

          $hours = Get-LogonHours
          Write-Host "Logon hours of $user after uninstalling: $hours"
          if ($hours -ne "All") { throw "uninstalling did not give the account its logon hours back ($hours)" }
          net.exe user $user /delete | Out-Null
          Write-Host "Install / block / run / upgrade / uninstall / unblock cycle passed."

      - name: Show logs
        if: failure()
        run: |
          Get-ChildItem "$env:ProgramData\PCLink\logs" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.FullName)"; Get-Content $_.FullName -Tail 100
          }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-30) } -MaxEvents 100 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'PCLink|Python|Application Error|\.NET Runtime' } | Format-List TimeCreated, ProviderName, Message
          Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager'; StartTime = (Get-Date).AddMinutes(-30) } -MaxEvents 20 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Message

      - name: Upload the zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ steps.version.outputs.artifact }}.zip
          if-no-files-found: error

  package:
    name: Sign the release package
    # release builds only (workflow_call with release: true); never for pushes or pull requests
    if: ${{ inputs.release }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release-signing
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    defaults:
      run:
        shell: pwsh
    env:
      ARTIFACT: ${{ needs.build.outputs.artifact }}
    steps:
      # No checkout and no pip here: until the certificate has been used and removed again, this
      # job runs nothing but Windows' own tools on the files the build job produced.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Sign the executables, the scripts and the catalog (when a certificate is configured)
        id: sign
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $zip = "$env:ARTIFACT.zip"
          if (-not $env:SIGN_PFX_BASE64) {
            Write-Host "::warning::No code-signing certificate configured (secrets SIGN_PFX_BASE64 / SIGN_PFX_PASSWORD); the release is unsigned."
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          Expand-Archive $zip -DestinationPath work
          $dir = (Resolve-Path "work/PCLink").Path
          # The certificate is handed to signtool as a file with its password (/f, /p), on purpose.
          # The alternative (importing it into the runner's certificate store and signing by
          # thumbprint) keeps the password off signtool's command line, but whatever can read
          # that command line on this throw-away machine can read the file and this step's
          # environment just as well, and a store import that leaves out the certificate's
          # intermediates would produce signatures that do not verify on other PCs.  What
          # protects the key is that this job runs nothing but Windows' own tools while it exists.
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                        Sort-Object FullName -Descending | Select-Object -First 1
            & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              "$dir\pclink.exe" "$dir\pclink-agent.exe"
            if ($LASTEXITCODE) { exit 1 }
            # The scripts as well: the self-update runs install.ps1 as SYSTEM and checks its signature.
            & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              "$dir\install.ps1" "$dir\uninstall.ps1" "$dir\defender-exclusion.ps1"
            if ($LASTEXITCODE) { exit 1 }
            # A signed catalog of every file in the package: the self-update of a signed copy
            # only installs a download whose files are exactly the ones listed here
            # (pclink/codesign.py).  Made last, so that it covers the signed executables and
            # scripts, and the VERSION file.
            $cat = Join-Path $env:RUNNER_TEMP "pclink.cat"
            New-FileCatalog -Path $dir -CatalogFilePath $cat -CatalogVersion 2 | Out-Null
            & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $cat
            if ($LASTEXITCODE) { exit 1 }
            Copy-Item $cat "$dir\pclink.cat"
          } finally {
            Remove-Item $pfx -Force
          }
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Check the signed package and pack it again
        if: steps.sign.outputs.signed == 'true'
        run: |
          $dir = (Resolve-Path "work/PCLink").Path
          $check = Test-FileCatalog -CatalogFilePath "$dir\pclink.cat" -Path $dir -Detailed -FilesToSkip pclink.cat
          if ($check.Status -ne "Valid") { Write-Error "the catalog does not match the package"; exit 1 }
          foreach ($name in "pclink.exe", "pclink-agent.exe", "install.ps1", "pclink.cat") {
            $sig = Get-AuthenticodeSignature -LiteralPath (Join-Path $dir $name)
            Write-Host "$name : $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -in "NotSigned", "HashMismatch") { Write-Error "$name is not properly signed"; exit 1 }
          }
          $zip = "$env:ARTIFACT.zip"
          Remove-Item $zip
          Compress-Archive -Path work/PCLink -DestinationPath $zip
          Get-Item $zip | Format-Table Name, Length

      - name: Name the artifact
        id: name
        run: |
          "artifact=$env:ARTIFACT-release" >> $env:GITHUB_OUTPUT

      - name: Upload the zip to publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ needs.build.outputs.artifact }}.zip
          if-no-files-found: error
